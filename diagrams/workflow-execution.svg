<?xml version="1.0" encoding="UTF-8"?>
<svg
      id="workflow-execution"
      viewBox="0 0 800 300"
      width="100%"
      height="100%"
      xmlns="http://www.w3.org/2000/svg"
      
    >
      <defs>
        <marker
          id="arrow-wf"
          viewBox="0 0 10 7"
          refX="9"
          refY="3.5"
          markerWidth="8"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <polygon points="0 0, 10 3.5, 0 7" fill="#27272A" />
        </marker>
        <marker
          id="arrow-brand-wf"
          viewBox="0 0 10 7"
          refX="9"
          refY="3.5"
          markerWidth="8"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <polygon points="0 0, 10 3.5, 0 7" fill="#A855F7" />
        </marker>
      </defs>

      
      <rect x="40" y="120" width="90" height="44" rx="8" fill="#0E0E10" stroke="#27272A" strokeWidth="1.5" />
      <text x="85" y="146" textAnchor="middle" fill="#FAFAFA" fontSize="13" fontWeight="500">Input</text>

      
      <line x1="130" y1="142" x2="180" y2="142" stroke="#27272A" strokeWidth="1.5" markerEnd="url(#arrow-wf)" />

      
      <rect x="188" y="115" width="120" height="54" rx="8" fill="#0E0E10" stroke="#A855F7" strokeWidth="2" />
      <text x="248" y="139" textAnchor="middle" fill="#FAFAFA" fontSize="13" fontWeight="600">LLM</text>
      <text x="248" y="157" textAnchor="middle" fill="#A1A1AA" fontSize="11">process</text>

      
      <line x1="308" y1="142" x2="358" y2="142" stroke="#27272A" strokeWidth="1.5" markerEnd="url(#arrow-wf)" />

      
      <polygon
        points="410,104 462,142 410,180 358,142"
        fill="#0E0E10"
        stroke="#27272A"
        strokeWidth="1.5"
      />
      <text x="410" y="139" textAnchor="middle" fill="#FAFAFA" fontSize="12" fontWeight="500">Cond-</text>
      <text x="410" y="153" textAnchor="middle" fill="#FAFAFA" fontSize="12" fontWeight="500">ition</text>

      
      <polyline
        points="410,104 410,70 520,70"
        fill="none"
        stroke="#A855F7"
        strokeWidth="1.5"
        markerEnd="url(#arrow-brand-wf)"
      />
      <text x="460" y="62" textAnchor="middle" fill="#A855F7" fontSize="11" fontWeight="500">Branch A</text>

      
      <rect x="528" y="48" width="120" height="44" rx="8" fill="#0E0E10" stroke="#A855F7" strokeWidth="1.5" />
      <text x="588" y="67" textAnchor="middle" fill="#FAFAFA" fontSize="13" fontWeight="500">Transform</text>
      <text x="588" y="83" textAnchor="middle" fill="#A1A1AA" fontSize="11">format data</text>

      
      <line x1="648" y1="70" x2="688" y2="70" stroke="#A855F7" strokeWidth="1.5" markerEnd="url(#arrow-brand-wf)" />

      
      <rect x="696" y="48" width="90" height="44" rx="8" fill="#0E0E10" stroke="#A855F7" strokeWidth="1.5" />
      <text x="741" y="74" textAnchor="middle" fill="#FAFAFA" fontSize="13" fontWeight="500">Output A</text>

      
      <polyline
        points="410,180 410,215 520,215"
        fill="none"
        stroke="#27272A"
        strokeWidth="1.5"
        markerEnd="url(#arrow-wf)"
      />
      <text x="460" y="230" textAnchor="middle" fill="#A1A1AA" fontSize="11" fontWeight="500">Branch B</text>

      
      <rect x="528" y="193" width="120" height="44" rx="8" fill="#0E0E10" stroke="#27272A" strokeWidth="1.5" />
      <text x="588" y="212" textAnchor="middle" fill="#FAFAFA" fontSize="13" fontWeight="500">Fallback</text>
      <text x="588" y="228" textAnchor="middle" fill="#A1A1AA" fontSize="11">default path</text>

      
      <line x1="648" y1="215" x2="688" y2="215" stroke="#27272A" strokeWidth="1.5" markerEnd="url(#arrow-wf)" />

      
      <rect x="696" y="193" width="90" height="44" rx="8" fill="#0E0E10" stroke="#27272A" strokeWidth="1.5" />
      <text x="741" y="219" textAnchor="middle" fill="#FAFAFA" fontSize="13" fontWeight="500">Output B</text>
    </svg>
