<?xml version="1.0" encoding="UTF-8"?>
<svg
      id="workflow-execution"
      viewBox="0 0 800 300"
      width="800"
      height="300"
      xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
      <defs>
        <marker
          id="arrow-wf"
          viewBox="0 0 10 7"
          refX="9"
          refY="3.5"
          markerWidth="8"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <polygon points="0 0, 10 3.5, 0 7" fill="#27272A" />
        </marker>
        <marker
          id="arrow-brand-wf"
          viewBox="0 0 10 7"
          refX="9"
          refY="3.5"
          markerWidth="8"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <polygon points="0 0, 10 3.5, 0 7" fill="#A855F7" />
        </marker>
      </defs>

      
      <rect x="40" y="120" width="90" height="44" rx="8" fill="#0E0E10" stroke="#27272A" stroke-width="2.1" />
      <text x="85" y="146" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="500">Input</text>

      
      <line x1="130" y1="142" x2="180" y2="142" stroke="#27272A" stroke-width="2.1" marker-end="url(#arrow-wf)" />

      
      <rect x="188" y="115" width="120" height="54" rx="8" fill="#0E0E10" stroke="#A855F7" stroke-width="2.8" />
      <text x="248" y="139" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="600">LLM</text>
      <text x="248" y="157" text-anchor="middle" fill="#A1A1AA" font-size="17.6">process</text>

      
      <line x1="308" y1="142" x2="358" y2="142" stroke="#27272A" stroke-width="2.1" marker-end="url(#arrow-wf)" />

      
      <polygon
        points="410,104 462,142 410,180 358,142"
        fill="#0E0E10"
        stroke="#27272A"
        stroke-width="2.1"
      />
      <text x="410" y="139" text-anchor="middle" fill="#FAFAFA" font-size="19.2" font-weight="500">Cond-</text>
      <text x="410" y="153" text-anchor="middle" fill="#FAFAFA" font-size="19.2" font-weight="500">ition</text>

      
      <polyline
        points="410,104 410,70 520,70"
        fill="none"
        stroke="#A855F7"
        stroke-width="2.1"
        marker-end="url(#arrow-brand-wf)"
      />
      <text x="460" y="62" text-anchor="middle" fill="#A855F7" font-size="17.6" font-weight="500">Branch A</text>

      
      <rect x="528" y="48" width="120" height="44" rx="8" fill="#0E0E10" stroke="#A855F7" stroke-width="2.1" />
      <text x="588" y="67" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="500">Transform</text>
      <text x="588" y="83" text-anchor="middle" fill="#A1A1AA" font-size="17.6">format data</text>

      
      <line x1="648" y1="70" x2="688" y2="70" stroke="#A855F7" stroke-width="2.1" marker-end="url(#arrow-brand-wf)" />

      
      <rect x="696" y="48" width="90" height="44" rx="8" fill="#0E0E10" stroke="#A855F7" stroke-width="2.1" />
      <text x="741" y="74" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="500">Output A</text>

      
      <polyline
        points="410,180 410,215 520,215"
        fill="none"
        stroke="#27272A"
        stroke-width="2.1"
        marker-end="url(#arrow-wf)"
      />
      <text x="460" y="230" text-anchor="middle" fill="#A1A1AA" font-size="17.6" font-weight="500">Branch B</text>

      
      <rect x="528" y="193" width="120" height="44" rx="8" fill="#0E0E10" stroke="#27272A" stroke-width="2.1" />
      <text x="588" y="212" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="500">Fallback</text>
      <text x="588" y="228" text-anchor="middle" fill="#A1A1AA" font-size="17.6">default path</text>

      
      <line x1="648" y1="215" x2="688" y2="215" stroke="#27272A" stroke-width="2.1" marker-end="url(#arrow-wf)" />

      
      <rect x="696" y="193" width="90" height="44" rx="8" fill="#0E0E10" stroke="#27272A" stroke-width="2.1" />
      <text x="741" y="219" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="500">Output B</text>
