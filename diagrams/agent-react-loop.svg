<?xml version="1.0" encoding="UTF-8"?>
<svg
      id="agent-react-loop"
      viewBox="0 0 800 300"
      width="100%"
      height="100%"
      xmlns="http://www.w3.org/2000/svg"
      
    >
      <defs>
        <marker
          id="arrow-react"
          viewBox="0 0 10 7"
          refX="9"
          refY="3.5"
          markerWidth="8"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <polygon points="0 0, 10 3.5, 0 7" fill="#27272A" />
        </marker>
        <marker
          id="arrow-brand-react"
          viewBox="0 0 10 7"
          refX="9"
          refY="3.5"
          markerWidth="8"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <polygon points="0 0, 10 3.5, 0 7" fill="#A855F7" />
        </marker>
      </defs>

      
      <rect x="20" y="120" width="110" height="44" rx="8" fill="#0E0E10" stroke="#27272A" stroke-width="1.5" />
      <text x="75" y="146" text-anchor="middle" fill="#FAFAFA" font-size="13" font-weight="500">User Message</text>

      
      <line x1="130" y1="142" x2="170" y2="142" stroke="#27272A" stroke-width="1.5" marker-end="url(#arrow-react)" />

      
      <rect x="178" y="120" width="110" height="44" rx="8" fill="#0E0E10" stroke="#A855F7" stroke-width="2" />
      <text x="233" y="139" text-anchor="middle" fill="#FAFAFA" font-size="13" font-weight="600">LLM</text>
      <text x="233" y="155" text-anchor="middle" fill="#A1A1AA" font-size="11">(Reason)</text>

      
      <line x1="288" y1="142" x2="338" y2="142" stroke="#27272A" stroke-width="1.5" marker-end="url(#arrow-react)" />

      
      <polygon
        points="380,108 422,142 380,176 338,142"
        fill="#0E0E10"
        stroke="#27272A"
        stroke-width="1.5"
      />
      <text x="380" y="139" text-anchor="middle" fill="#FAFAFA" font-size="11" font-weight="500">Tool</text>
      <text x="380" y="152" text-anchor="middle" fill="#FAFAFA" font-size="11" font-weight="500">Call?</text>

      
      <line x1="380" y1="176" x2="380" y2="220" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrow-brand-react)" />
      <text x="392" y="200" fill="#A855F7" font-size="11" font-weight="500">Yes</text>

      
      <rect x="325" y="228" width="110" height="44" rx="8" fill="#0E0E10" stroke="#A855F7" stroke-width="1.5" />
      <text x="380" y="254" text-anchor="middle" fill="#FAFAFA" font-size="13" font-weight="500">Execute Tool</text>

      
      <line x1="435" y1="250" x2="478" y2="250" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrow-brand-react)" />

      
      <rect x="486" y="228" width="110" height="44" rx="8" fill="#0E0E10" stroke="#A855F7" stroke-width="1.5" />
      <text x="541" y="254" text-anchor="middle" fill="#FAFAFA" font-size="13" font-weight="500">Tool Result</text>

      
      <polyline
        points="596,250 650,250 650,60 233,60 233,120"
        fill="none"
        stroke="#A855F7"
        stroke-width="1.5"
        marker-end="url(#arrow-brand-react)"
      />
      <text x="450" y="52" text-anchor="middle" fill="#A855F7" font-size="11" font-style="italic">loop</text>

      
      <line x1="422" y1="142" x2="478" y2="142" stroke="#27272A" stroke-width="1.5" marker-end="url(#arrow-react)" />
      <text x="450" y="134" text-anchor="middle" fill="#A1A1AA" font-size="11" font-weight="500">No</text>

      
      <rect x="486" y="120" width="120" height="44" rx="8" fill="#0E0E10" stroke="#27272A" stroke-width="1.5" />
      <text x="546" y="139" text-anchor="middle" fill="#FAFAFA" font-size="13" font-weight="500">Generate</text>
      <text x="546" y="155" text-anchor="middle" fill="#FAFAFA" font-size="13" font-weight="500">Response</text>

      
      <line x1="606" y1="142" x2="650" y2="142" stroke="#27272A" stroke-width="1.5" marker-end="url(#arrow-react)" />

      
      <rect x="658" y="120" width="120" height="44" rx="8" fill="#0E0E10" stroke="#27272A" stroke-width="1.5" />
      <text x="718" y="139" text-anchor="middle" fill="#FAFAFA" font-size="13" font-weight="500">Stream</text>
      <text x="718" y="155" text-anchor="middle" fill="#FAFAFA" font-size="13" font-weight="500">to User</text>
    </svg>
