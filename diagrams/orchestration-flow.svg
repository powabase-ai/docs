<?xml version="1.0" encoding="UTF-8"?>
<svg
      id="orchestration-flow"
      viewBox="0 0 800 300"
      width="800"
      height="300"
      xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
      <defs>
        <marker
          id="arrow-orch"
          viewBox="0 0 10 7"
          refX="9"
          refY="3.5"
          markerWidth="8"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <polygon points="0 0, 10 3.5, 0 7" fill="#27272A" />
        </marker>
        <marker
          id="arrow-brand-orch"
          viewBox="0 0 10 7"
          refX="9"
          refY="3.5"
          markerWidth="8"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <polygon points="0 0, 10 3.5, 0 7" fill="#A855F7" />
        </marker>
      </defs>

      
      <rect x="30" y="120" width="90" height="44" rx="8" fill="#0E0E10" stroke="#27272A" stroke-width="2.1" />
      <text x="75" y="146" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="500">User</text>

      
      <line x1="120" y1="142" x2="175" y2="142" stroke="#27272A" stroke-width="2.1" marker-end="url(#arrow-orch)" />

      
      <rect x="183" y="115" width="130" height="54" rx="8" fill="#0E0E10" stroke="#A855F7" stroke-width="2.8" />
      <text x="248" y="139" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="600">Coordinator</text>
      <text x="248" y="157" text-anchor="middle" fill="#A1A1AA" font-size="17.6">orchestrator</text>

      
      
      <polyline
        points="313,132 360,132 390,80"
        fill="none"
        stroke="#A855F7"
        stroke-width="2.1"
        marker-end="url(#arrow-brand-orch)"
      />
      
      <polyline
        points="313,152 360,152 390,204"
        fill="none"
        stroke="#A855F7"
        stroke-width="2.1"
        marker-end="url(#arrow-brand-orch)"
      />

      
      <text x="350" y="118" text-anchor="middle" fill="#A855F7" font-size="16" font-style="italic">parallel</text>

      
      <rect x="393" y="55" width="110" height="50" rx="8" fill="#0E0E10" stroke="#A855F7" stroke-width="2.1" />
      <text x="448" y="77" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="500">Agent A</text>
      <text x="448" y="94" text-anchor="middle" fill="#A1A1AA" font-size="17.6">specialist</text>

      
      <rect x="393" y="190" width="110" height="50" rx="8" fill="#0E0E10" stroke="#A855F7" stroke-width="2.1" />
      <text x="448" y="212" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="500">Agent B</text>
      <text x="448" y="229" text-anchor="middle" fill="#A1A1AA" font-size="17.6">specialist</text>

      
      
      <polyline
        points="503,80 545,80 570,132"
        fill="none"
        stroke="#A855F7"
        stroke-width="2.1"
        marker-end="url(#arrow-brand-orch)"
      />
      
      <polyline
        points="503,215 545,215 570,152"
        fill="none"
        stroke="#A855F7"
        stroke-width="2.1"
        marker-end="url(#arrow-brand-orch)"
      />

      
      <text x="555" y="118" text-anchor="middle" fill="#A855F7" font-size="16" font-style="italic">merge</text>

      
      <rect x="575" y="115" width="110" height="54" rx="8" fill="#0E0E10" stroke="#A855F7" stroke-width="2.1" />
      <text x="630" y="139" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="500">Aggregate</text>
      <text x="630" y="157" text-anchor="middle" fill="#A1A1AA" font-size="17.6">results</text>

      
      <line x1="685" y1="142" x2="695" y2="142" stroke="#27272A" stroke-width="2.1" marker-end="url(#arrow-orch)" />

      
      <rect x="700" y="120" width="80" height="44" rx="8" fill="#0E0E10" stroke="#27272A" stroke-width="2.1" />
      <text x="740" y="146" text-anchor="middle" fill="#FAFAFA" font-size="20.8" font-weight="500">Response</text>
    </svg>
